<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
  </defs>

  <!-- Card Border & Background -->
  <rect x="10" y="10" width="880" height="460" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="35" y="48" fill="#f0f6fc" font-size="20" font-weight="600">PrismGate-Enterprise v2.0 - FinOps &amp; Latency Empirical Benchmark</text>
  <text x="35" y="72" fill="#8b949e" font-size="13">Measured across 1,000 WildChat &amp; LMSYS Evaluation Prompts on AWS Bedrock (us-east-1)</text>

  <!-- Divider -->
  <line x1="35" y1="88" x2="865" y2="88" stroke="#30363d" stroke-width="1" />

  <!-- SECTION 1: Latency Benchmark (Left Panel) -->
  <text x="35" y="118" fill="#58a6ff" font-size="15" font-weight="600">⚡ P95 Response Latency (Lower is Better)</text>

  <!-- Metric 1: Cache Hit -->
  <text x="35" y="152" fill="#c9d1d9" font-size="13">Tier-1 &amp; Tier-2 Cache HIT</text>
  <rect x="230" y="138" width="28" height="20" rx="4" fill="url(#gradGreen)" />
  <text x="268" y="153" fill="#3fb950" font-size="13" font-weight="600">7.62 ms (DynamoDB)</text>

  <!-- Metric 2: Nova Micro -->
  <text x="35" y="188" fill="#c9d1d9" font-size="13">Amazon Nova Micro (Simple)</text>
  <rect x="230" y="174" width="160" height="20" rx="4" fill="url(#gradBlue)" />
  <text x="400" y="189" fill="#58a6ff" font-size="13" font-weight="600">380 ms (Fast Path)</text>

  <!-- Metric 3: Claude 3.5 Sonnet -->
  <text x="35" y="224" fill="#c9d1d9" font-size="13">Claude 3.5 Sonnet (Direct)</text>
  <rect x="230" y="210" width="480" height="20" rx="4" fill="url(#gradRed)" opacity="0.85" />
  <text x="720" y="225" fill="#f85149" font-size="13" font-weight="600">1,620 ms</text>

  <!-- SECTION 2: Enterprise FinOps Cost Comparison (Bottom Panel) -->
  <text x="35" y="275" fill="#a371f7" font-size="15" font-weight="600">💰 Enterprise Cost Per 100K Invocations (Lower is Better)</text>

  <!-- Unmanaged Spend -->
  <text x="35" y="310" fill="#c9d1d9" font-size="13">Unmanaged (100% Frontier)</text>
  <rect x="230" y="296" width="520" height="24" rx="4" fill="url(#gradRed)" opacity="0.9" />
  <text x="760" y="313" fill="#f85149" font-size="14" font-weight="700">$360.00 USD</text>

  <!-- PrismGate Managed Spend -->
  <text x="35" y="348" fill="#c9d1d9" font-size="13">PrismGate-Enterprise</text>
  <rect x="230" y="334" width="241" height="24" rx="4" fill="url(#gradGreen)" />
  <text x="482" y="351" fill="#3fb950" font-size="14" font-weight="700">$166.78 USD (-53.67%)</text>

  <!-- SECTION 3: Summary Metric Badges (Cards at bottom) -->
  <rect x="35" y="385" width="255" height="65" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="408" fill="#8b949e" font-size="12">NET COST REDUCTION</text>
  <text x="50" y="438" fill="#3fb950" font-size="22" font-weight="700">53.67%</text>
  <text x="145" y="437" fill="#8b949e" font-size="12">Verified on AWS</text>

  <rect x="320" y="385" width="255" height="65" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="335" y="408" fill="#8b949e" font-size="12">P95 LATENCY IMPROVEMENT</text>
  <text x="335" y="438" fill="#58a6ff" font-size="22" font-weight="700">80.2% Faster</text>
  <text x="490" y="437" fill="#8b949e" font-size="12">Cache Hits</text>

  <rect x="605" y="385" width="255" height="65" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="620" y="408" fill="#8b949e" font-size="12">MONTHLY IDLE SPEND</text>
  <text x="620" y="438" fill="#a371f7" font-size="22" font-weight="700">$0.00 / mo</text>
  <text x="745" y="437" fill="#8b949e" font-size="12">Free Tier</text>
</svg>
